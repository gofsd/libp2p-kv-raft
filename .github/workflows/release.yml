name: Release

# Triggered by `mage major/minor/patch` (which creates and prints the
# annotated tag locally) once that tag is pushed with `git push --tags`.
# Builds the release binaries (see magefile.go's releaseBinaries) for every
# platform `mage build` covers and attaches them to a GitHub Release. Also
# builds and attaches a generic, leader-agnostic kvmobile.aar (no
# -ldflags -- see docs/android.md's "Downloading a prebuilt AAR" section
# for what that means for a consuming app) -- unlike the desktop binaries
# this is a *library* artifact, not
# something end users run directly, so it needs no signing of its own;
# signing only enters the picture for android-app/'s own release APK/AAB
# (mage buildandroidreleasebundle/buildandroidreleaseapk), which stay a
# separate, manually-run path since they need signing material this
# workflow has no access to. Does not build web-app artifacts -- wasm-pack
# output has no equivalent "attach to a GitHub Release" story since it's
# consumed as an npm/vite build input, not a binary a browser downloads
# directly.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build release binaries and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1.25.x rather than go-version-file: go.mod -- release artifacts should
      # carry the newest patched stdlib of the minor go.mod targets, not the
      # older floor that directive records. See ci.yml's go job for the full
      # reasoning, including why not `stable`.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          # check-latest so this resolves to the newest 1.25 patch rather than
          # whatever the runner image cached -- see ci.yml's go job.
          check-latest: true

      - name: install mingw-w64 (cgo cross-compiler for windows/amd64 --
          see magefile.go's BuildWindows doc comment)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: install mage
        run: go install github.com/magefile/mage@latest

      - name: mage buildLinux
        run: mage buildLinux

      - name: mage buildWindows
        run: mage buildWindows

      - name: install NDK (API 26+ required -- see
          docs/android.md's "Prerequisites" section for why gomobile bind
          needs it)
        run: |
          NDK_VERSION="28.2.13676358"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: install gobind (go tool gomobile bind shells out to a
          `gobind` binary on PATH by literal name -- see ci.yml's
          matching step for why this is needed)
        run: |
          go install golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: build generic kvmobile.aar (no -ldflags -- no
          leaderMultiaddr baked in, so a consuming app must call
          Join/JoinWithKey, never Start/StartWithKey -- see
          docs/android.md's "Downloading a prebuilt AAR" section)
        run: |
          go tool gomobile bind -target=android -androidapi 26 \
            -o kvmobile.aar ./mobile/kvmobile

      - name: package archives
        run: |
          cd dist
          for platform_dir in */; do
            platform="${platform_dir%/}"
            if [[ "$platform" == windows_* ]]; then
              zip -r "../${platform}.zip" "$platform"
            else
              tar -czf "../${platform}.tar.gz" "$platform"
            fi
          done

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            kvmobile.aar
          generate_release_notes: true
