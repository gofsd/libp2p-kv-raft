name: CI

# See CONTRIBUTING.md's "Why full e2e isn't in CI" -- this workflow covers
# what's portable to a generic hosted runner (build/vet/lint, unit +
# integration tests, and compile-only smoke checks for the Android/wasm
# targets). The real cross-platform e2e pipeline (mage e2e:all/e2e:current)
# needs a real SSH-reachable bootstrap host and a real Android emulator,
# and stays a local pre-push gate (mage githooks:install) instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build/vet/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt (must be clean)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: install mage
        run: go install github.com/magefile/mage@latest

      - name: mage test
        run: mage test

      - name: mage integration
        run: mage integration

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck ./...
        run: govulncheck ./...

  android-smoke:
    name: Android compile smoke (mobile/kvmobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install NDK (API 26+ required -- see README's "Follower on
          Android" section for why gomobile bind needs it)
        run: |
          NDK_VERSION="28.2.13676358"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: install gobind (go tool gomobile bind shells out to a
          `gobind` binary on PATH by literal name -- the go.mod tool
          directive makes `go tool gobind` runnable but doesn't put it on
          PATH, so gomobile bind can't find it without this)
        run: |
          go install golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile bind (compile-only smoke, no identity/leader baked
          in -- mirrors mage buildandroid's own scope, not a real e2e run)
        run: |
          mkdir -p /tmp/kvmobile-smoke
          go tool gomobile bind -target=android -androidapi 26 \
            -o /tmp/kvmobile-smoke/kvmobile.aar ./mobile/kvmobile

  web-smoke:
    name: wasm compile smoke (web-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: install llvm-ar and capnp (web-app/.cargo/wasm-ar.sh needs
          llvm-ar on PATH for sqlite-wasm-rs's build script -- this
          runner's clang is preinstalled and unversioned, but llvm-ar only
          exists under a version-suffixed name until this runs; build.rs
          separately needs the capnp compiler itself for `api/shmevent.capnp`,
          which isn't preinstalled at all)
        run: |
          sudo apt-get update && sudo apt-get install -y llvm capnproto
          sudo ln -sf "$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" /usr/local/bin/llvm-ar

      - name: wasm-pack build
        working-directory: web-app
        run: wasm-pack build --target web --out-dir pkg

  release-build-smoke:
    name: Release binary compile smoke (mage buildLinux/buildWindows)
    runs-on: ubuntu-latest
    # Exercises the same cross-compile paths `mage build`/release tagging
    # depend on, on every push/PR -- these previously were no-op stubs that
    # silently built nothing, and separately thirdparty/libc's vendored copy
    # of modernc.org/libc was trimmed down to Linux-only, so windows/amd64
    # builds were broken with no signal anywhere in CI. Both are real now
    # (see README's "Vendored dependency patch" section); this job is what
    # would have caught either regression.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install mingw-w64 (cgo cross-compiler for windows/amd64 --
          see magefile.go's BuildWindows doc comment)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: install mage
        run: go install github.com/magefile/mage@latest

      - name: mage buildLinux
        run: mage buildLinux

      - name: mage buildWindows
        run: mage buildWindows
